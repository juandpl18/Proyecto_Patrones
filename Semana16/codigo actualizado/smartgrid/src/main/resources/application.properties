spring.application.name=smartgrid

# --- Base de datos (credenciales por variables de entorno, no en el repositorio) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartgrid}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA: Flyway manda sobre el esquema, Hibernate solo valida ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Tu BD ya tiene la tabla usuario: Flyway la toma como versión 1 (baseline)
# y solo ejecuta las migraciones nuevas (V2 en adelante).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- JWT ---
smartgrid.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-cambiala-32-bytes-min}
smartgrid.jwt.expiracion-minutos=60

# --- CORS (origen del frontend Angular) ---
smartgrid.cors.allowed-origins=http://localhost:4200    

# --- Facturación ---
smartgrid.facturacion.zona-horaria=America/Bogota